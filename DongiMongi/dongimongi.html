<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Dongimongi - گروهی</title>
<style>
:root{
  --bg:#0f172a; --card:#0b1220; --muted:#94a3b8; --accent:#0284c7;
  --success:#16a34a; --danger:#ef4444; --glass: rgba(255,255,255,0.03);
}
html,body{height:100%;margin:0;font-family:Tahoma, Arial, sans-serif;background:linear-gradient(180deg,#071029 0%, #071a2a 100%);color:#e6eef8}
.container{max-width:820px;margin:18px auto;padding:18px;background:var(--card);border-radius:12px;box-shadow:0 6px 30px rgba(2,6,23,0.6)}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.h-title{font-weight:700;font-size:18px}
.small{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.input,select,textarea{background:var(--glass);border:1px solid rgba(255,255,255,0.03);padding:8px;border-radius:8px;color:#e6eef8}
.btn{background:var(--accent);color:white;padding:8px 12px;border-radius:8px;border:0;cursor:pointer}
.btn-danger{background:var(--danger)}
.list{margin-top:12px;padding:10px;background:rgba(255,255,255,0.02);border-radius:8px}
.checkbox-item{display:inline-block;margin:6px 8px}
#premium-banner{display:none}
.lock-badge{background:#fde68a;color:#92400e;padding:6px 10px;border-radius:8px}
#expense-list li{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px dashed rgba(255,255,255,0.02)}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <div class="h-title">Dongimongi</div>
      <div class="small" id="display-group">گروه: —</div>
    </div>
    <div style="text-align:right">
      <div class="small">کاربر: <span id="display-treasurer">—</span></div>
      <div id="premium-banner">🔓 برای امکانات کامل، اشتراک پریمیوم تهیه کنید</div>
    </div>
  </div>

  <div id="step1">
    <div style="margin-bottom:10px">
      <input id="group-name" class="input" placeholder="نام گروه" />
      <input id="member-count" class="input" type="number" min="2" max="10" placeholder="تعداد اعضا" style="width:120px" />
      <button class="btn" onclick="generateInputs()">ایجاد فرم اعضا</button>
    </div>
    <div id="members-inputs" class="list"></div>
    <div style="margin-top:10px">
      <button class="btn" onclick="setupGroup()">ساخت گروه</button>
    </div>
  </div>

  <div id="step2" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div id="lock-badge" class="lock-badge" style="display:none">🔒 گروه قفل شده</div>
      <div>
        <button id="end-trip-btn" class="btn" onclick="endTrip()">قفل گروه</button>
        <button class="btn btn-danger" onclick="resetApp()">پاک کردن گروه</button>
      </div>
    </div>

    <div id="active-forms">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
        <input id="expense-title" class="input" placeholder="عنوان هزینه" style="flex:1" />
        <input id="expense-amount" class="input" placeholder="مبلغ" style="width:140px" />
        <select id="type-select" class="input" onchange="toggleParticipantBox()" style="width:160px">
          <option value="shared">اشتراکی</option>
          <option value="personal">شخصی</option>
        </select>
        <select id="creator-select" class="input" style="width:160px"></select>
        <select id="payer-select" class="input" style="width:160px"></select>
      </div>

      <div id="participants-container" style="margin-bottom:8px">
        <div id="participant-checkboxes"></div>
      </div>

      <div style="display:flex;gap:8px;margin-bottom:8px">
        <input id="expense-note" class="input" placeholder="یادداشت (اختیاری)" style="flex:1" />
        <button class="btn" onclick="addExpense()">ثبت هزینه</button>
      </div>
    </div>

    <div class="list">
      <h4 style="margin:6px 0">هزینه‌های اشتراکی</h4>
      <ul id="expense-list" style="list-style:none;padding:0;margin:0"></ul>
    </div>

    <div class="list" style="margin-top:10px">
      <div id="result"></div>
      <button id="copy-btn" class="btn" style="display:none;margin-top:8px" onclick="copyReportToTelegram()">کپی گزارش</button>
    </div>

    <div id="personal-section" class="list" style="margin-top:10px">
      <h4 style="margin:6px 0">گزارش شخصی</h4>
      <select id="personal-report-select" class="input" onchange="showPersonalReport()"></select>
      <div id="personal-result" style="margin-top:8px"></div>
    </div>
  </div>
</div>

<script>
/* ====== تنظیمات سوپابیس ====== */
const SUP_URL = 'https://xdghwghwakalwykkedgr.supabase.co';
const SUP_KEY = 'sb_publishable__8XU0DUFPkEC5d3b2v0yog_qdDUrDzw ';

/* ====== وضعیت محلی ====== */
let tg = window.Telegram?.WebApp || {};
try { tg.expand(); } catch(e) {}
let tgUser = tg.initDataUnsafe?.user;
let telegramFullName = tgUser ? (tgUser.first_name + (tgUser.last_name ? ' ' + tgUser.last_name : '')) : '';
let userId = tgUser?.id || null;
let userPlan = "free";
let premiumExpire = null;
let currentGroupId = null;
let groupName = "";
let treasurer = "";
let members = [];
let expenses = [];
let isLocked = false;
let settlementStatus = {};
let referralParam = new URLSearchParams(location.search).get('ref');

/* ====== توابع کمکی ====== */
async function dbFetch(endpoint, method = 'GET', data = null) {
    try {
        let options = {
            method,
            headers: {
                'apikey': SUP_KEY,
                'Authorization': `Bearer ${SUP_KEY}`,
                'Content-Type': 'application/json',
                'Prefer': 'resolution=merge-duplicates'
            }
        };
        if (data) options.body = JSON.stringify(data);
        const res = await fetch(`${SUP_URL}/rest/v1/${endpoint}`, options);
        if (!res.ok) return null;
        if (method === 'GET') return await res.json();
        return true;
    } catch (e) { return null; }
}

/* ====== مدیریت کاربر و اشتراک ====== */
async function loadUserPlan() {
    if (!userId) return;

    let userData = await dbFetch(`users?id=eq.${userId}`);
    let isNew = false;

    if (!userData || userData.length === 0) {
        await dbFetch('users', 'POST', {
            id: userId,
            full_name: telegramFullName,
            plan: 'free'
        });
        userPlan = 'free';
        isNew = true;
    } else {
        let u = userData[0];
        userPlan = u.plan || 'free';
        premiumExpire = u.premium_expire_at ? new Date(u.premium_expire_at) : null;

        if (premiumExpire && premiumExpire < new Date()) {
            // پایان اشتراک → قفل همه گروه‌ها
            await dbFetch(`groups?user_id=eq.${userId}&is_locked=eq.false`, 'PATCH', { is_locked: true });

            // تبدیل به رایگان
            await dbFetch(`users?id=eq.${userId}`, 'PATCH', {
                plan: 'free',
                premium_expire_at: null
            });

            userPlan = 'free';
        }
    }

    // سیستم معرفی
    if (referralParam && referralParam !== String(userId) && isNew) {
        let refUser = await dbFetch(`users?id=eq.${referralParam}`);
        if (refUser && refUser.length > 0) {
            let newCount = (refUser[0].referral_count || 0) + 1;
            let patch = { referral_count: newCount };
            if (newCount >= 15) {
                let expire = new Date(Date.now() + 30*24*3600*1000).toISOString();
                patch.plan = 'premium';
                patch.premium_expire_at = expire;
            }
            await dbFetch(`users?id=eq.${referralParam}`, 'PATCH', patch);
        }
    }

    if (userPlan === 'free') {
        document.getElementById("premium-banner").style.display = "block";
    }
}

/* ====== قفل خودکار گروه‌های قدیمی ====== */
async function autoLockOldGroups() {
    let ts = new Date(Date.now() - 24*3600*1000).toISOString();
    await dbFetch(`groups?is_locked=eq.false&created_at=lt.${ts}`, 'PATCH', { is_locked: true });
    await dbFetch(`groups?is_locked=eq.true&created_at=lt.${ts}`, 'DELETE');
}

/* ====== تولید فرم اعضا ====== */
function generateInputs() {
    let cnt = parseInt(document.getElementById("member-count").value) || 0;
    if (cnt < 2) return alert("حداقل ۲ عضو لازم است.");
    let container = document.getElementById("members-inputs");
    container.innerHTML = "";
    for (let i=0;i<cnt;i++){
        container.innerHTML += `
            <div style="margin-bottom:6px">
                <input class="input m-name" placeholder="نام عضو ${i+1}" style="width:60%"/>
                <label class="small">مادرخرج؟ <input type="checkbox" class="is-treasurer" /></label>
            </div>`;
    }
}

/* ====== ساخت گروه ====== */
async function setupGroup() {
    if (!userId) return alert("کاربر نامشخص است.");

    let name = document.getElementById("group-name").value.trim();
    if (!name) return alert("نام گروه را وارد کنید.");

    let nameInputs = Array.from(document.querySelectorAll(".m-name")).map(i => i.value.trim()).filter(x=>x);
    if (nameInputs.length === 0) return alert("حداقل یک عضو وارد کنید.");

    /* ===== نسخه رایگان ===== */
    if (userPlan === 'free') {
        if (currentGroupId) return alert("نسخه رایگان فقط یک گروه فعال دارد.");
        let userData = await dbFetch(`users?id=eq.${userId}`);
        let lastCreated = userData[0].last_group_created_at;
        if (lastCreated) {
            let diffHours = (Date.now() - new Date(lastCreated)) / 3600000;
            if (diffHours < 168) return alert("نسخه رایگان هفته‌ای فقط یک گروه می‌تواند بسازد.");
        }
        if (nameInputs.length > 3) return alert("نسخه رایگان فقط ۳ عضو دارد.");
    }

    /* ===== نسخه پریمیوم ===== */
    if (userPlan === 'premium') {
        // محدودیت ۳ گروه فعال
        let activeGroups = await dbFetch(`groups?user_id=eq.${userId}&is_locked=eq.false`);
        if (activeGroups.length >= 3) return alert("شما ۳ گروه فعال دارید. ابتدا یکی را قفل کنید.");

        // محدودیت ۱۰ گروه در ماه
        let monthStart = new Date();
        monthStart.setDate(1);
        monthStart.setHours(0,0,0,0);
        let monthlyGroups = await dbFetch(`groups?user_id=eq.${userId}&created_at=gte.${monthStart.toISOString()}`);
        if (monthlyGroups.length >= 10) return alert("نسخه پریمیوم ماهانه حداکثر ۱۰ گروه دارد.");

        // محدودیت ساخت هر ۱۲ ساعت
        let userData = await dbFetch(`users?id=eq.${userId}`);
        let lastCreated = userData[0].last_group_created_at;
        if (lastCreated) {
            let diffHours = (Date.now() - new Date(lastCreated)) / 3600000;
            if (diffHours < 12) return alert("نسخه پریمیوم هر ۱۲ ساعت فقط یک گروه می‌تواند بسازد.");
        }

        // محدودیت اعضا
        if (nameInputs.length > 10) return alert("نسخه پریمیوم حداکثر ۱۰ عضو دارد.");
    }

    /* ===== ظرفیت حجمی ===== */
    let size = JSON.stringify(nameInputs).length;
    if (size > 1024*1024) return alert("ظرفیت ۱MB شما پر شده است.");

    /* ===== ساخت گروه ===== */
    let tre = null;
    let checkboxes = Array.from(document.querySelectorAll(".is-treasurer"));
    for (let i=0;i<checkboxes.length;i++){
        if (checkboxes[i].checked) { tre = nameInputs[i]; break; }
    }
    if (!tre) tre = nameInputs[0];

    let newGroup = {
        id: Date.now(),
        user_id: userId,
        group_name: name,
        treasurer: tre,
        members: nameInputs,
        is_locked: false,
        created_at: new Date().toISOString()
    };

    let ok = await dbFetch('groups', 'POST', newGroup);
    if (!ok) return alert("خطا در ایجاد گروه.");

    await dbFetch(`users?id=eq.${userId}`, 'PATCH', { last_group_created_at: new Date().toISOString() });

    currentGroupId = newGroup.id;
    localStorage.setItem("current_group_id", currentGroupId);

    groupName = name;
    treasurer = tre;
    members = nameInputs;
    expenses = [];
    isLocked = false;
    settlementStatus = {};
    members.forEach(m => settlementStatus[m] = false);

    document.getElementById("step1").style.display = "none";
    document.getElementById("step2").style.display = "block";
    document.getElementById("display-group").innerText = "گروه: " + groupName;
    document.getElementById("display-treasurer").innerText = treasurer;
    updateDropdowns();
    renderParticipantCheckboxes();
    renderList();
    calculate();
    checkLockState();
}

/* ====== چک‌باکس اعضا ====== */
function renderParticipantCheckboxes() {
    let container = document.getElementById("participant-checkboxes");
    if (!container) return;
    container.innerHTML = members.map(m => `
        <label class="checkbox-item">
            <input type="checkbox" class="part-chk" value="${m}" checked> ${m}
        </label>
    `).join("");
}

/* ====== نمایش شرکا ====== */
function toggleParticipantBox() {
    let type = document.getElementById("type-select").value;
    document.getElementById("participants-container").style.display = (type === 'shared') ? 'block' : 'none';
}

/* ====== وضعیت قفل ====== */
function checkLockState() {
    if (isLocked) {
        document.getElementById("active-forms").style.display = "none";
        document.getElementById("lock-badge").style.display = "block";
        document.getElementById("end-trip-btn").style.display = "none";
    } else {
        document.getElementById("active-forms").style.display = "block";
        document.getElementById("lock-badge").style.display = "none";
        document.getElementById("end-trip-btn").style.display = "block";
    }
}

/* ====== قفل گروه ====== */
async function endTrip() {
    if(confirm("آیا از پایان سفر مطمئن هستید؟")) {
        if (!currentGroupId) return;
        isLocked = true;
        await dbFetch(`groups?id=eq.${currentGroupId}`, 'PATCH', { is_locked: true });
        checkLockState();
        alert("سفر قفل شد!");
    }
}

/* ====== افزودن هزینه ====== */
async function addExpense() {
    if (isLocked) return alert("سفر قفل شده است.");
    if (!current
