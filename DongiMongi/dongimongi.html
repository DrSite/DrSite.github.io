<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Dongimongi - گروهی</title>

<style>
:root{
  --bg:#0f172a;
  --card:#0b1220;
  --glass:rgba(255,255,255,0.06);
  --accent:#00c6ff;
  --accent2:#0072ff;
  --muted:#94a3b8;
  --danger:#ef4444;
}

body{
  margin:0;
  font-family:Tahoma, Arial;
  background:linear-gradient(180deg,#071029,#071a2a);
  color:#e6eef8;
  direction:rtl;
}

.container{
  max-width:820px;
  margin:20px auto;
  padding:20px;
  background:var(--card);
  border-radius:16px;
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
  animation:fadeIn .6s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

.input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:0;
  background:var(--glass);
  color:#e6eef8;
  font-size:15px;
  backdrop-filter:blur(10px);
  transition:0.25s;
}

.input:focus{
  outline:none;
  background:rgba(255,255,255,0.12);
}

.btn{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  border:0;
  padding:12px 18px;
  border-radius:12px;
  color:white;
  cursor:pointer;
  font-size:15px;
  transition:0.25s;
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(0,0,0,0.3);
}

.member-card{
  background:var(--glass);
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  backdrop-filter:blur(10px);
}

.member-card input{
  width:65%;
}

.member-card label{
  font-size:13px;
  color:var(--muted);
}

.section-title{
  font-size:18px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:8px;
}

</style>
</head>
<body>

<div class="container">

  <!-- فرم ساخت گروه جدید -->
  <div id="step1">

    <div class="section-title">✨ ساخت گروه جدید</div>

    <div style="margin-bottom:12px">
      <input id="group-name" class="input" placeholder="📝 نام گروه" />
    </div>

    <div style="margin-bottom:12px">
      <input id="member-count" class="input" type="number" min="2" max="10" placeholder="👥 تعداد اعضا (۲ تا ۱۰)" />
    </div>

    <button class="btn" onclick="generateInputs()">🚀 ایجاد فرم اعضا</button>

    <div id="members-inputs" style="margin-top:14px"></div>

    <button class="btn" style="margin-top:14px;width:100%" onclick="setupGroup()">🎉 ساخت گروه</button>

  </div>

  <!-- ادامه پروژه (Step2 و سایر بخش‌ها) -->
  <div id="step2" style="display:none">
    <!-- این بخش دست‌نخورده است -->
  </div>

</div>

<script>

/* ====== فرم اعضا جدید ====== */
function generateInputs(){
  let cnt = parseInt(document.getElementById("member-count").value);
  if(cnt < 2) return alert("حداقل ۲ عضو لازم است.");

  let box = document.getElementById("members-inputs");
  box.innerHTML = "";

  for(let i=0;i<cnt;i++){
    box.innerHTML += `
      <div class="member-card">
        <input class="input m-name" placeholder="👤 نام عضو ${i+1}" />
        <label>
          مادرخرج؟ 
          <input type="checkbox" class="is-treasurer" />
        </label>
      </div>
    `;
  }
}

/* ====== ادامه کدهای اصلی پروژه (بدون تغییر) ====== */

const SUP_URL = 'https://xdghwghwakalwykkedgr.supabase.co';
const SUP_KEY = 'sb_publishable__8XU0DUFPkEC5d3b2v0yog_qdDUrDzw ';

let tg = window.Telegram?.WebApp || {};
try { tg.expand(); } catch(e) {}
let tgUser = tg.initDataUnsafe?.user;
let telegramFullName = tgUser ? (tgUser.first_name + (tgUser.last_name ? ' ' + tgUser.last_name : '')) : '';
let userId = tgUser?.id || null;
let userPlan = "free";
let premiumExpire = null;
let currentGroupId = null;
let groupName = "";
let treasurer = "";
let members = [];
let expenses = [];
let isLocked = false;
let settlementStatus = {};
let referralParam = new URLSearchParams(location.search).get('ref');

async function dbFetch(endpoint, method='GET', data=null){
  try{
    let opt = {
      method,
      headers:{
        'apikey':SUP_KEY,
        'Authorization':`Bearer ${SUP_KEY}`,
        'Content-Type':'application/json',
        'Prefer':'resolution=merge-duplicates'
      }
    };
    if(data) opt.body = JSON.stringify(data);
    let res = await fetch(`${SUP_URL}/rest/v1/${endpoint}`, opt);
    if(!res.ok) return null;
    return method==='GET' ? await res.json() : true;
  }catch(e){ return null; }
}

/* بقیه کدهای پروژه بدون تغییر… */

</script>

</body>
</html>
