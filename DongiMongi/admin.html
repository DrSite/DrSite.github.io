<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8" />
<title>پنل ادمین حرفه‌ای Dongimongi</title>
<style>
body {
    background:#0f172a;
    color:white;
    font-family:tahoma;
    padding:40px;
}
.box {
    max-width:700px;
    margin:auto;
    background:#1e293b;
    padding:20px;
    border-radius:12px;
}
input, select {
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:8px;
    border:0;
}
button {
    width:100%;
    padding:12px;
    margin-top:15px;
    background:#0284c7;
    color:white;
    border:0;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}
.user-item {
    background:#0f172a;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
}
.action-btn {
    background:#22c55e;
    padding:6px 10px;
    border-radius:6px;
    border:0;
    cursor:pointer;
    margin-left:5px;
}
.action-btn-danger {
    background:#ef4444;
}
#login-box {
    max-width:350px;
    margin:auto;
    background:#1e293b;
    padding:20px;
    border-radius:12px;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-box">
    <h2>ورود ادمین</h2>
    <input id="admin-user" placeholder="نام کاربری" />
    <input id="admin-pass" placeholder="رمز عبور" type="password" />
    <button onclick="adminLogin()">ورود</button>
    <p id="login-msg" style="color:#ef4444"></p>
</div>

<!-- PANEL -->
<div id="panel" style="display:none">
    <div class="box">
        <h2>پنل ادمین حرفه‌ای</h2>

        <input id="search" placeholder="جستجوی کاربر با آیدی یا نام..." oninput="searchUser()" />

        <div id="results"></div>

        <p id="msg" style="margin-top:15px;color:#22c55e"></p>
    </div>
</div>

<script>
/* ====== تنظیمات سوپابیس ====== */
const SUP_URL = 'https://xdghwghwakalwykkedgr.supabase.co';
const SUP_KEY = 'sb_publishable__8XU0DUFPkEC5d3b2v0yog_qdDUrDzw ';

/* ====== ورود ادمین ====== */
const ADMIN_USER = "dongimongi";     // نام کاربری ادمین
const ADMIN_PASS = "A97gg%20ffB6@";    // رمز ادمین

function adminLogin() {
    let u = document.getElementById("admin-user").value.trim();
    let p = document.getElementById("admin-pass").value.trim();

    if (u === ADMIN_USER && p === ADMIN_PASS) {
        document.getElementById("login-box").style.display = "none";
        document.getElementById("panel").style.display = "block";
    } else {
        document.getElementById("login-msg").innerText = "نام کاربری یا رمز اشتباه است.";
    }
}

/* ====== توابع سوپابیس ====== */
async function dbFetch(endpoint, method = 'GET', data = null) {
    try {
        let options = {
            method,
            headers: {
                'apikey': SUP_KEY,
                'Authorization': `Bearer ${SUP_KEY}`,
                'Content-Type': 'application/json',
                'Prefer': 'resolution=merge-duplicates'
            }
        };
        if (data) options.body = JSON.stringify(data);
        const res = await fetch(`${SUP_URL}/rest/v1/${endpoint}`, options);
        if (!res.ok) return null;
        if (method === 'GET') return await res.json();
        return true;
    } catch(e) { return null; }
}

/* ====== جستجوی کاربر ====== */
async function searchUser() {
    let q = document.getElementById("search").value.trim();
    if (!q) {
        document.getElementById("results").innerHTML = "";
        return;
    }

    let users = await dbFetch(`users?full_name=ilike.*${q}*`);
    let byId = await dbFetch(`users?id=eq.${q}`);

    let all = [...(users || []), ...(byId || [])];

    let html = "";
    all.forEach(u => {
        html += `
        <div class="user-item">
            <b>${u.full_name}</b><br>
            آیدی: ${u.id}<br>
            پلن: ${u.plan}<br>
            معرفی‌ها: ${u.referral_count || 0}<br>
            پایان اشتراک: ${u.premium_expire_at || "—"}<br>

            <button class="action-btn" onclick="activatePremium(${u.id})">فعال‌سازی پریمیوم</button>
            <button class="action-btn" onclick="extendPremium(${u.id})">تمدید ۳۰ روز</button>
            <button class="action-btn action-btn-danger" onclick="removePremium(${u.id})">حذف اشتراک</button>
            <button class="action-btn action-btn-danger" onclick="lockAllGroups(${u.id})">قفل همه گروه‌ها</button>
            <button class="action-btn action-btn-danger" onclick="deleteAllGroups(${u.id})">حذف همه گروه‌ها</button>
            <button class="action-btn" onclick="showGroups(${u.id})">نمایش گروه‌ها</button>
        </div>
        `;
    });

    document.getElementById("results").innerHTML = html;
}

/* ====== فعال‌سازی اشتراک ====== */
async function activatePremium(userId) {
    let expire = new Date(Date.now() + 30*24*3600*1000).toISOString();
    await dbFetch(`users?id=eq.${userId}`, 'PATCH', {
        plan: 'premium',
        premium_expire_at: expire
    });
    document.getElementById("msg").innerText = "اشتراک فعال شد!";
}

/* ====== تمدید اشتراک ====== */
async function extendPremium(userId) {
    let expire = new Date(Date.now() + 30*24*3600*1000).toISOString();
    await dbFetch(`users?id=eq.${userId}`, 'PATCH', {
        premium_expire_at: expire
    });
    document.getElementById("msg").innerText = "اشتراک تمدید شد!";
}

/* ====== حذف اشتراک ====== */
async function removePremium(userId) {
    await dbFetch(`users?id=eq.${userId}`, 'PATCH', {
        plan: 'free',
        premium_expire_at: null
    });
    document.getElementById("msg").innerText = "اشتراک حذف شد!";
}

/* ====== قفل همه گروه‌ها ====== */
async function lockAllGroups(userId) {
    await dbFetch(`groups?user_id=eq.${userId}&is_locked=eq.false`, 'PATCH', {
        is_locked: true
    });
    document.getElementById("msg").innerText = "همه گروه‌ها قفل شدند!";
}

/* ====== حذف همه گروه‌ها ====== */
async function deleteAllGroups(userId) {
    await dbFetch(`groups?user_id=eq.${userId}`, 'DELETE');
    document.getElementById("msg").innerText = "همه گروه‌ها حذف شدند!";
}

/* ====== نمایش گروه‌های کاربر ====== */
async function showGroups(userId) {
    let groups = await dbFetch(`groups?user_id=eq.${userId}`);
    if (!groups || groups.length === 0) {
        document.getElementById("msg").innerText = "هیچ گروهی یافت نشد.";
        return;
    }

    let html = "<h3>گروه‌های کاربر:</h3>";
    groups.forEach(g => {
        html += `
            <div class="user-item">
                <b>${g.group_name}</b><br>
                آیدی گروه: ${g.id}<br>
                مادرخرج: ${g.treasurer}<br>
                اعضا: ${g.members.join(", ")}<br>
                وضعیت: ${g.is_locked ? "قفل" : "باز"}<br>
                تاریخ ساخت: ${g.created_at}<br>
            </div>
        `;
    });

    document.getElementById("results").innerHTML = html;
}
</script>

</body>
</html>
